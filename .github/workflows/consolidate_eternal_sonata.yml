name: Consolidate Eternal Sonata plugin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate_eternal_sonata.yml'

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build single Eternal Sonata plugin
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          base_path = Path('plugins/__files_eternal_sonata_base.py')
          wrapper_path = Path('plugins/files_eternal_sonata.py')

          base = base_path.read_text(encoding='utf-8')
          wrapper = wrapper_path.read_text(encoding='utf-8')

          # O BMD usa json; o restante já existe no script base.
          if 'import json\n' not in base:
              base = base.replace('import os\n', 'import os\nimport json\n', 1)

          # Remove somente o register_plugin antigo; todas as funções FILES/NTX/DDS ficam intactas.
          entry_marker = '# ==============================================================================\n# ENTRY POINT (REGISTRO)\n# ==============================================================================\n'
          if entry_marker not in base:
              raise RuntimeError('Marcador ENTRY POINT não encontrado no script base')
          base_body = base.split(entry_marker, 1)[0].rstrip() + '\n\n'

          # Pega somente a implementação BMD; elimina imports, globals duplicados e o wrapper _base.
          bmd_start = wrapper.index('BMD_MAGIC = b"BMD "')
          reg_start = wrapper.index('\ndef register_plugin(', bmd_start)
          bmd_section = wrapper[bmd_start:reg_start].rstrip() + '\n\n'

          # Se output_encoding for alterado, não reaproveitar bytes da codificação antiga.
          bmd_section = bmd_section.replace(
              '            if translated == original_text:\n',
              '            if output_encoding.lower() == source_encoding.lower() and translated == original_text:\n',
              1,
          )

          register = r'''# ==============================================================================
# ENTRY POINT (REGISTRO) - FILES + NTX3/DDS + BMD
# ==============================================================================
def register_plugin(log_func, option_getter, host_language="pt_BR", page=None):
    global logger, get_option, current_lang, host_page
    logger = log_func
    get_option = option_getter
    current_lang = host_language
    host_page = page

    if host_page:
        for picker in (
            fp_extract,
            fp_reimport,
            fp_ntx_extract,
            fp_ntx_import,
            fp_bmd_extract,
            fp_bmd_import,
        ):
            if picker not in host_page.overlay:
                host_page.overlay.append(picker)
        host_page.update()

    return {
        "name": bt("plugin_name"),
        "description": bt("plugin_description"),
        "commands": [
            {"label": t("extract_file"), "action": action_extract_file},
            {"label": t("import_files"), "action": action_import_files},
            {"label": t("extract_ntx"), "action": action_extract_ntx},
            {"label": t("import_dds"), "action": action_import_dds},
            {"label": bt("extract_bmd"), "action": action_extract_bmd},
            {"label": bt("import_bmd"), "action": action_import_bmd},
        ],
    }
'''

          final = base_body + bmd_section + register
          wrapper_path.write_text(final, encoding='utf-8', newline='\n')
          py_compile.compile(str(wrapper_path), doraise=True)

          # Verificações simples para garantir que a consolidação realmente ocorreu.
          check = wrapper_path.read_text(encoding='utf-8')
          required = [
              'def _extract_files(',
              'def _reimport_files(',
              'def _extract_ntx(',
              'def _import_dds(',
              'def _parse_bmd_structure(',
              'def _extract_bmd(',
              'def _import_bmd(',
          ]
          missing = [x for x in required if x not in check]
          if missing:
              raise RuntimeError(f'Funções ausentes após consolidação: {missing}')
          if '__files_eternal_sonata_base' in check:
              raise RuntimeError('O script consolidado ainda depende do arquivo auxiliar')
          PY

      - name: Commit consolidated plugin
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm plugins/__files_eternal_sonata_base.py
          git rm .github/workflows/consolidate_eternal_sonata.yml
          git add plugins/files_eternal_sonata.py
          git commit -m "Consolidate Eternal Sonata plugin into one script"
          git push
