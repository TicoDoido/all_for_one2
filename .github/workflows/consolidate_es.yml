name: Eternal Sonata one-file consolidation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/consolidate_es.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate plugin
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          base_path = Path('plugins/__files_eternal_sonata_base.py')
          main_path = Path('plugins/files_eternal_sonata.py')
          base = base_path.read_text(encoding='utf-8')
          main = main_path.read_text(encoding='utf-8')

          if 'import json\n' not in base:
              base = base.replace('import os\n', 'import os\nimport json\n', 1)

          marker = '# ==============================================================================\n# ENTRY POINT (REGISTRO)\n# ==============================================================================\n'
          base_body = base.split(marker, 1)[0].rstrip() + '\n\n'

          bmd_start = main.index('BMD_MAGIC = b"BMD "')
          reg_start = main.index('\ndef register_plugin(', bmd_start)
          bmd = main[bmd_start:reg_start].rstrip() + '\n\n'
          bmd = bmd.replace(
              '            if translated == original_text:\n',
              '            if output_encoding.lower() == source_encoding.lower() and translated == original_text:\n',
              1,
          )

          lines = []
          lines.append('# ==============================================================================')
          lines.append('# ENTRY POINT (REGISTRO) - FILES + NTX3/DDS + BMD')
          lines.append('# ==============================================================================')
          lines.append('def register_plugin(log_func, option_getter, host_language="pt_BR", page=None):')
          lines.append('    global logger, get_option, current_lang, host_page')
          lines.append('    logger = log_func')
          lines.append('    get_option = option_getter')
          lines.append('    current_lang = host_language')
          lines.append('    host_page = page')
          lines.append('')
          lines.append('    if host_page:')
          lines.append('        for picker in (fp_extract, fp_reimport, fp_ntx_extract, fp_ntx_import, fp_bmd_extract, fp_bmd_import):')
          lines.append('            if picker not in host_page.overlay:')
          lines.append('                host_page.overlay.append(picker)')
          lines.append('        host_page.update()')
          lines.append('')
          lines.append('    return {')
          lines.append('        "name": bt("plugin_name"),')
          lines.append('        "description": bt("plugin_description"),')
          lines.append('        "commands": [')
          lines.append('            {"label": t("extract_file"), "action": action_extract_file},')
          lines.append('            {"label": t("import_files"), "action": action_import_files},')
          lines.append('            {"label": t("extract_ntx"), "action": action_extract_ntx},')
          lines.append('            {"label": t("import_dds"), "action": action_import_dds},')
          lines.append('            {"label": bt("extract_bmd"), "action": action_extract_bmd},')
          lines.append('            {"label": bt("import_bmd"), "action": action_import_bmd},')
          lines.append('        ],')
          lines.append('    }')
          lines.append('')

          final = base_body + bmd + '\n'.join(lines)
          main_path.write_text(final, encoding='utf-8', newline='\n')
          py_compile.compile(str(main_path), doraise=True)

          check = main_path.read_text(encoding='utf-8')
          for required in ('def _extract_files(', 'def _reimport_files(', 'def _extract_ntx(', 'def _import_dds(', 'def _parse_bmd_structure(', 'def _extract_bmd(', 'def _import_bmd('):
              if required not in check:
                  raise RuntimeError('Missing function: ' + required)
          if '__files_eternal_sonata_base' in check:
              raise RuntimeError('Still depends on base helper')
          PY

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm plugins/__files_eternal_sonata_base.py
          git rm .github/workflows/consolidate_es.yml
          git rm -f .github/workflows/consolidate_eternal_sonata.yml || true
          git add plugins/files_eternal_sonata.py
          git commit -m "Consolidate Eternal Sonata plugin into one script"
          git push
